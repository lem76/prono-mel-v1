name: Alert Settimanali Prono Mel v1
on:
  schedule:
    - cron: '30 17 * * 4'
    - cron: '0 10 * * 5'
    - cron: '0 11 * * 6,0'
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy scikit-learn requests
      - name: Esegui Controllo e Alert Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert_telegram.py
